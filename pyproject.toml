[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rabbit-fem"
version = "2026.9.0"
description = "A lightweight MOOSE distribution packaging thermal and solid mechanics"
readme = "README.md"
requires-python = ">=3.9"
license = "LGPL-2.1"
authors = [
    { name = "scepticalrabbit (Lloyd Fletcher)" },
]
dependencies = [
    "ziglang>=0.16.0",
    "patchelf>=0.17; sys_platform != 'win32'",
    "gmsh>=4.13.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
rabbit = "rabbit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rabbit"]
artifacts = [
    "src/rabbit/bin/*",
    "src/rabbit/lib/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/include",
    "/scripts",
    "/Makefile",
    "/build.zig",
    "/README.md",
    "/LICENSE",
]
