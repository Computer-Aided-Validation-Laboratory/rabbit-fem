[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rabbit-fem"
version = "2026.9.0"
description = "Lightweight MOOSE distribution packaging thermal and solid mechanics"
readme = "README.md"
requires-python = ">=3.9"
license = "LGPL-2.1"
authors = [
    { name = "scepticalrabbit (Lloyd Fletcher)" },
]
dependencies = [
    "ziglang>=0.16.0",
    "patchelf>=0.17",
    "gmsh>=4.13.0",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "twine>=5.0.0",
    "wheel>=0.40.0",
]
test = [
    "pytest>=8.0.0",
]


[project.scripts]
rabbit = "rabbit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rabbit"]

[tool.hatch.build.targets.wheel.force-include]
"src/rabbit/bin" = "rabbit/bin"
"src/rabbit/lib" = "rabbit/lib"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/include",
    "/scripts",
    "/build_rabbit.py",
    "/Makefile",
    "/build.zig",
    "/README.md",
    "/LICENSE",
]

