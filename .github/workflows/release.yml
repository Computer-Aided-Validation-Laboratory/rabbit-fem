name: "Release: Build, Consolidate & Publish"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not publish to PyPI or create release)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build-linux:
    name: "Linux: Build and Verify Wheel"
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: "Linux: Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "Linux: Install system packages"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            libopenmpi-dev \
            openmpi-bin \
            patchelf \
            libtirpc-dev \
            libomp-dev \
            libglu1-mesa

      - name: "Linux: Set up uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: "Linux: Set up Python"
        run: |
          uv python install 3.13
          uv venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: "Linux: Install Python build tools"
        run: |
          uv pip install ziglang==0.16.0 wheel packaging pyyaml jinja2 pytest gmsh

      - name: "Linux: Restore wheel cache"
        uses: actions/cache/restore@v4
        id: wheel-cache
        with:
          path: |
            dist
            src/rabbit/bin
            src/rabbit/lib
          key: rabbit-fem-wheel-Linux-${{ hashFiles('src/**', 'include/**', 'Makefile', 'pyproject.toml', 'moose_version.txt', 'build_rabbit.py') }}

      - name: "Linux: Restore MOOSE cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: moose-cache
        with:
          path: |
            moose/petsc
            moose/libmesh/installed
            moose/framework/contrib/wasp/install
            moose/framework/include/base/MooseConfig.h
          key: linux-moose-build-${{ hashFiles('moose_version.txt', 'build_rabbit.py') }}

      - name: "Linux: Build MOOSE dependencies"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.moose-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --moose

      - name: "Linux: Save MOOSE cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.moose-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            moose/petsc
            moose/libmesh/installed
            moose/framework/contrib/wasp/install
            moose/framework/include/base/MooseConfig.h
          key: linux-moose-build-${{ hashFiles('moose_version.txt', 'build_rabbit.py') }}

      - name: "Linux: Build Rabbit, stage artifacts, and build wheel"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --wheel

      - name: "Linux: Run test suite"
        run: |
          uv run python build_rabbit.py --test

      - name: "Linux: Save wheel cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist
            src/rabbit/bin
            src/rabbit/lib
          key: rabbit-fem-wheel-Linux-${{ hashFiles('src/**', 'include/**', 'Makefile', 'pyproject.toml', 'moose_version.txt', 'build_rabbit.py') }}

      - name: "Linux: Upload wheel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-fem-linux-wheel
          path: dist/*.whl
          if-no-files-found: error

  build-windows:
    name: "Windows: Build and Verify Wheel"
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: "Windows: Configure git long paths"
        run: git config --global core.longpaths true

      - name: "Windows: Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "Windows: Set up MSYS2"
        uses: msys2/setup-msys2@v2
        with:
          msys2-location: 'C:\msys64'
          msystem: MSYS
          path-type: inherit
          update: false
          install: >-
            make
            diffutils
            patch
            python
            m4
            git
            cmake

      - name: "Windows: Set up uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: "Windows: Set up Python"
        run: |
          uv python install 3.13
          uv venv .venv

      - name: "Windows: Restore wheel cache"
        uses: actions/cache/restore@v4
        id: wheel-windows-cache
        with:
          path: |
            dist
            src/rabbit/bin
          key: rabbit-fem-wheel-Windows-${{ hashFiles('src/**', 'include/**', 'Makefile', 'pyproject.toml', 'moose_version.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'build_rabbit.py', 'patches/**') }}

      - name: "Windows: Restore MOOSE cache"
        if: steps.wheel-windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: moose-windows-cache
        with:
          path: |
            moose/petsc/arch-windows-opt
            moose/libmesh/installed
            moose/framework/contrib/wasp/install
            moose/framework/contrib/wasp/build
            moose/framework/contrib/hit/hit.exe
            moose/framework/include/base/MooseConfig.h
          key: windows-moose-build-${{ hashFiles('moose_version.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'patches/**') }}

      - name: "Windows: Build MOOSE dependencies and Rabbit"
        if: steps.wheel-windows-cache.outputs.cache-hit != 'true'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install_dependencies_windows.ps1 -SkipTests

      - name: "Windows: Save MOOSE cache"
        if: steps.wheel-windows-cache.outputs.cache-hit != 'true' && steps.moose-windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            moose/petsc/arch-windows-opt
            moose/libmesh/installed
            moose/framework/contrib/wasp/install
            moose/framework/contrib/wasp/build
            moose/framework/contrib/hit/hit.exe
            moose/framework/include/base/MooseConfig.h
          key: windows-moose-build-${{ hashFiles('moose_version.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'patches/**') }}

      - name: "Windows: Package standalone wheel"
        if: steps.wheel-windows-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --wheel-only

      - name: "Windows: Run test suite"
        run: |
          uv run python build_rabbit.py --test

      - name: "Windows: Save wheel cache"
        if: steps.wheel-windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist
            src/rabbit/bin
          key: rabbit-fem-wheel-Windows-${{ hashFiles('src/**', 'include/**', 'Makefile', 'pyproject.toml', 'moose_version.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'build_rabbit.py', 'patches/**') }}

      - name: "Windows: Upload wheel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-fem-windows-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: "Publish Consolidated Release to PyPI"
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/rabbit-fem
    permissions:
      contents: write
      id-token: write

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Verify tag is on main branch"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Tag ${{ github.ref_name }} is not on the main branch! Skipping release."
            exit 1
          }

      - name: "Download all built wheels"
        uses: actions/download-artifact@v4
        with:
          pattern: rabbit-fem-*-wheel
          merge-multiple: true
          path: dist/

      - name: "Verify all required platform wheels are present"
        run: |
          echo "=== Content of dist/ ==="
          ls -la dist/
          linux_count=$(ls dist/*manylinux*.whl 2>/dev/null | wc -l)
          win_count=$(ls dist/*win_amd64.whl 2>/dev/null | wc -l)
          echo "Found $linux_count Linux wheel(s) and $win_count Windows wheel(s)."
          echo "NOTE: macOS wheels are not built for this release (see build jobs)."
          if [ "$linux_count" -lt 1 ]; then
            echo "::error::Missing Linux manylinux wheel in dist/!"
            exit 1
          fi
          if [ "$win_count" -lt 1 ]; then
            echo "::error::Missing Windows win_amd64 wheel in dist/!"
            exit 1
          fi
          echo "All platform wheels verified successfully."

      - name: "Publish consolidated wheels to PyPI"
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

      - name: "Create GitHub Release with wheel assets"
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
