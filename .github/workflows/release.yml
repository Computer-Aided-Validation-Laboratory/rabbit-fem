name: "Release: Build, Consolidate & Publish"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not publish to PyPI or create release)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build-linux:
    name: "Linux: Build and Verify Wheel"
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: "Linux: Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "Linux: Install system packages"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            libopenmpi-dev \
            openmpi-bin \
            patchelf \
            libtirpc-dev \
            libomp-dev \
            libglu1-mesa

      - name: "Linux: Set up uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: "Linux: Set up Python"
        run: |
          uv python install 3.13
          uv venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: "Linux: Install Python build tools"
        run: |
          uv pip install ziglang==0.16.0 wheel packaging pyyaml jinja2 pytest gmsh numpy netCDF4

      # Wheel and dependency caches use the exact same keys and paths as
      # linux_build_and_test.yml, so a release on a previously built tree
      # restores everything and only runs tests and packaging. This job
      # never saves caches; the build-and-test workflows own population.
      - name: "Linux: Restore wheel cache"
        uses: actions/cache/restore@v4
        id: wheel-cache
        with:
          path: |
            dist
            src/rabbit/bin
            src/rabbit/lib
            src/rabbit/share
          key: rabbit-fem-wheel-Linux-serial-${{ hashFiles('src/**', 'include/**', 'Makefile', 'pyproject.toml', 'moose_version.txt', 'moose_deps.txt', 'scripts/build/**', 'build_rabbit.py') }}

      # --- Stage 1: PETSc Dependency ---
      # NOTE: dependency caches use exact keys with no restore-keys prefix
      # fallback. A key miss means the recipe changed, so any older tree
      # would be stale; the build scripts skip stages whose artifacts already
      # exist, which would silently keep the stale tree (and re-save it under
      # the new key - see the Sep-28 X11 entry in dev/log_opencode_fixes.md).
      # A miss therefore rebuilds from scratch, which is what a recipe change
      # requires.
      - name: "Linux: Restore PETSc cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: petsc-cache
        with:
          path: moose/petsc
          key: linux-serial-petsc-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      # --- Stage 2: libMesh Dependency ---
      - name: "Linux: Restore libMesh cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: libmesh-cache
        with:
          path: moose/libmesh/installed
          key: linux-serial-libmesh-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      # --- Stage 3: WASP and HIT Dependency ---
      - name: "Linux: Restore WASP cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: wasp-cache
        with:
          path: |
            moose/framework/contrib/wasp/install
            moose/framework/contrib/hit
          key: linux-serial-wasp-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      # --- Stage 4: MOOSE Framework Configuration ---
      - name: "Linux: Restore MOOSE Config cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: mooseconfig-cache
        with:
          path: moose/framework/include/base/MooseConfig.h
          key: linux-serial-mooseconfig-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      - name: "Linux: Build MOOSE dependencies"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --moose

      - name: "Linux: Build Rabbit, stage artifacts, and build wheel"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --wheel

      - name: "Linux: Run test suite"
        run: |
          uv run python build_rabbit.py --test

      - name: "Linux: Upload wheel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-fem-linux-wheel
          path: dist/*.whl
          if-no-files-found: error

  build-mpi:
    name: "MPI/MFEM, Linux: Build and Verify Wheel"
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: "MPI: Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "MPI: Install system packages"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            libopenmpi-dev \
            openmpi-bin \
            patchelf \
            libtirpc-dev \
            libomp-dev \
            libglu1-mesa

      - name: "MPI: Set up uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: "MPI: Set up Python"
        run: |
          uv python install 3.13
          uv venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: "MPI: Install Python build tools"
        run: |
          uv pip install ziglang==0.16.0 wheel packaging pyyaml jinja2 pytest gmsh numpy netCDF4

      # MPI caches use the exact same -mpi suffixed keys as
      # mpi_build_and_test.yml. Restore-only; that workflow owns population.
      - name: "MPI: Restore wheel cache"
        uses: actions/cache/restore@v4
        id: wheel-cache
        with:
          path: |
            dist
            src/rabbit/bin
            src/rabbit/lib
            src/rabbit/share
          key: rabbit-fem-wheel-Linux-mpi-${{ hashFiles('src/**', 'include/**', 'Makefile', 'pyproject.toml', 'moose_version.txt', 'moose_deps.txt', 'scripts/build/**', 'build_rabbit.py') }}

      # NOTE: dependency caches use exact keys with no restore-keys prefix
      # fallback. A key miss means the recipe changed, so any older tree
      # would be stale; the build scripts skip stages whose artifacts already
      # exist, which would silently keep the stale tree (and re-save it under
      # the new key - see the Sep-28 X11 entry in dev/log_opencode_fixes.md).
      # A miss therefore rebuilds from scratch, which is what a recipe change
      # requires.
      - name: "MPI: Restore PETSc cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: petsc-cache
        with:
          path: moose/petsc
          key: linux-mpi-petsc-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      - name: "MPI: Restore libMesh cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: libmesh-cache
        with:
          path: moose/libmesh/installed
          key: linux-mpi-libmesh-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      - name: "MPI: Restore Conduit cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: conduit-cache
        with:
          path: moose/framework/contrib/conduit/installed
          key: linux-mpi-conduit-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      - name: "MPI: Restore WASP cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: wasp-cache
        with:
          path: |
            moose/framework/contrib/wasp/install
            moose/framework/contrib/hit
          key: linux-mpi-wasp-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      - name: "MPI: Restore MFEM cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: mfem-cache
        with:
          path: moose/framework/contrib/mfem/installed
          key: linux-mpi-mfem-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      - name: "MPI: Restore MOOSE Config cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: mooseconfig-cache
        with:
          # conf_vars.mk travels with the header: it carries the matching
          # ENABLE_MFEM/MFEM_DIR flags (cf. check_cached_moose_config).
          path: |
            moose/framework/include/base/MooseConfig.h
            moose/conf_vars.mk
          key: linux-mpi-mooseconfig-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      - name: "MPI: Build MOOSE dependencies"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        env:
          RABBIT_MPI: "1"
        run: |
          uv run python build_rabbit.py --moose

      - name: "MPI: Build Rabbit, stage artifacts, and build wheel"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        env:
          RABBIT_MPI: "1"
        run: |
          uv run python build_rabbit.py --wheel

      - name: "MPI: Run test suite"
        env:
          RABBIT_MPI: "1"
        run: |
          uv run python build_rabbit.py --test

      - name: "MPI: Upload wheel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-fem-mpi-wheel
          path: dist/*.whl
          if-no-files-found: error

  build-windows:
    name: "Windows: Build and Verify Wheel"
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: "Windows: Configure git long paths"
        run: git config --global core.longpaths true

      - name: "Windows: Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "Windows: Set up MSYS2"
        uses: msys2/setup-msys2@v2
        with:
          msys2-location: 'C:\msys64'
          msystem: MSYS
          path-type: inherit
          update: false
          install: >-
            make
            diffutils
            patch
            python
            m4
            git
            cmake

      - name: "Windows: Set up uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: "Windows: Set up Python"
        run: |
          uv python install 3.13
          uv venv .venv

      # Wheel and dependency caches use the exact same keys and paths as
      # windows_build_and_test.yml, so a release on a previously built tree
      # restores everything and only runs tests and packaging. This job
      # never saves caches; the build-and-test workflows own population.
      - name: "Windows: Restore wheel cache"
        uses: actions/cache/restore@v4
        id: wheel-windows-cache
        with:
          path: |
            dist
            src/rabbit/bin
            src/rabbit/share
          key: rabbit-fem-wheel-Windows-${{ hashFiles('src/**', 'include/**', 'Makefile', 'pyproject.toml', 'moose_version.txt', 'moose_deps.txt', 'scripts/**', 'build_rabbit.py', 'patches/**') }}

      # --- Stage 1: PETSc Dependency ---
      # NOTE: dependency caches use exact keys with no restore-keys prefix
      # fallback. A key miss means the recipe changed, so any older tree
      # would be stale; the build scripts skip stages whose artifacts already
      # exist, which would silently keep the stale tree (and re-save it under
      # the new key - see the Sep-28 X11 entry in dev/log_opencode_fixes.md).
      # A miss therefore rebuilds from scratch, which is what a recipe change
      # requires.
      - name: "Windows: Restore PETSc cache"
        if: steps.wheel-windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: petsc-windows-cache
        with:
          path: moose/petsc/arch-windows-opt
          key: windows-petsc-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'patches/**') }}

      # --- Stage 2: libMesh Dependency ---
      - name: "Windows: Restore libMesh cache"
        if: steps.wheel-windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: libmesh-windows-cache
        with:
          path: moose/libmesh/installed
          key: windows-libmesh-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'patches/**') }}

      # --- Stage 3: WASP and HIT Dependency ---
      - name: "Windows: Restore WASP cache"
        if: steps.wheel-windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: wasp-windows-cache
        with:
          path: |
            moose/framework/contrib/wasp/install
            moose/framework/contrib/wasp/build
            moose/framework/contrib/hit/hit.exe
          key: windows-wasp-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'patches/**') }}

      # --- Stage 4: MOOSE Framework Configuration ---
      - name: "Windows: Restore MOOSE Config cache"
        if: steps.wheel-windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: mooseconfig-windows-cache
        with:
          path: moose/framework/include/base/MooseConfig.h
          key: windows-mooseconfig-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'patches/**') }}

      - name: "Windows: Build MOOSE dependencies and Rabbit"
        if: steps.wheel-windows-cache.outputs.cache-hit != 'true'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install_dependencies_windows.ps1 -SkipTests

      - name: "Windows: Package standalone wheel"
        if: steps.wheel-windows-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --wheel-only

      - name: "Windows: Run test suite"
        run: |
          uv run python build_rabbit.py --test

      - name: "Windows: Upload wheel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-fem-windows-wheel
          path: dist/*.whl
          if-no-files-found: error

  build-macos:
    name: "macOS: Build and Verify Wheel"
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: "macOS: Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "macOS: Install system packages"
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install \
            gcc \
            llvm \
            libomp \
            libpng \
            bison \
            flex \
            pkgconf \
            cmake
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: "macOS: Set up uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: "macOS: Set up Python"
        run: |
          uv python install 3.13
          uv venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: "macOS: Install Python build tools"
        run: |
          uv pip install ziglang==0.16.0 wheel packaging pyyaml jinja2 pytest gmsh numpy netCDF4

      # Wheel and dependency caches use the exact same keys and paths as
      # macos_build_and_test.yml, so a release on a previously built tree
      # restores everything and only runs tests and packaging. This job
      # never saves caches; the build-and-test workflows own population.
      - name: "macOS: Restore wheel cache"
        uses: actions/cache/restore@v4
        id: wheel-cache
        with:
          path: |
            dist
            src/rabbit/bin
            src/rabbit/lib
            src/rabbit/share
          key: rabbit-fem-wheel-macOS-serial-${{ hashFiles('src/**', 'include/**', 'Makefile', 'pyproject.toml', 'moose_version.txt', 'moose_deps.txt', 'scripts/build/**', 'build_rabbit.py') }}

      # --- Stage 1: PETSc Dependency ---
      # NOTE: dependency caches use exact keys with no restore-keys prefix
      # fallback. A key miss means the recipe changed, so any older tree
      # would be stale; the build scripts skip stages whose artifacts already
      # exist, which would silently keep the stale tree (and re-save it under
      # the new key - see the Sep-28 X11 entry in dev/log_opencode_fixes.md).
      # A miss therefore rebuilds from scratch, which is what a recipe change
      # requires.
      - name: "macOS: Restore PETSc cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: petsc-cache
        with:
          path: moose/petsc
          key: macos-serial-petsc-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/darwin.py', 'scripts/build/common.py') }}

      # --- Stage 2: libMesh Dependency ---
      - name: "macOS: Restore libMesh cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: libmesh-cache
        with:
          path: moose/libmesh/installed
          key: macos-serial-libmesh-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/darwin.py', 'scripts/build/common.py') }}

      # --- Stage 3: WASP and HIT Dependency ---
      - name: "macOS: Restore WASP cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: wasp-cache
        with:
          path: |
            moose/framework/contrib/wasp/install
            moose/framework/contrib/hit
          key: macos-serial-wasp-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/darwin.py', 'scripts/build/common.py') }}

      # --- Stage 4: MOOSE Framework Configuration ---
      - name: "macOS: Restore MOOSE Config cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: mooseconfig-cache
        with:
          path: |
            moose/framework/include/base/MooseConfig.h
            moose/conf_vars.mk
          key: macos-serial-mooseconfig-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/darwin.py', 'scripts/build/common.py') }}

      - name: "macOS: Build MOOSE dependencies"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --moose

      - name: "macOS: Build Rabbit, stage artifacts, and build wheel"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --wheel

      - name: "macOS: Run test suite"
        run: |
          uv run python build_rabbit.py --test

      - name: "macOS: Upload wheel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-fem-macos-wheel
          path: dist/*.whl
          if-no-files-found: error

  # Clean-machine smoke tests: fresh runners with no checkout and therefore
  # no moose/ source tree, so the binary's baked in-tree fallback paths
  # cannot mask a broken wheel. Publish is gated on these, not just the
  # build-tree test suites.
  smoke-linux:
    name: "Linux: Clean-machine smoke test"
    needs: build-linux
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux
      artifact: rabbit-fem-linux-wheel
      runner: ubuntu-24.04

  smoke-windows:
    name: "Windows: Clean-machine smoke test"
    needs: build-windows
    uses: ./.github/workflows/smoke.yml
    with:
      platform: windows
      artifact: rabbit-fem-windows-wheel
      runner: windows-latest

  smoke-macos:
    name: "macOS: Clean-machine smoke test"
    needs: build-macos
    uses: ./.github/workflows/smoke.yml
    with:
      platform: macos
      artifact: rabbit-fem-macos-wheel
      runner: macos-15

  smoke-mpi:
    name: "MPI: Clean-machine smoke test"
    needs: build-mpi
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux
      artifact: rabbit-fem-mpi-wheel
      runner: ubuntu-24.04
      mpi: true

  publish:
    name: "Publish Consolidated Release to PyPI"
    needs: [build-linux, build-windows, build-macos, build-mpi, smoke-linux, smoke-windows, smoke-macos, smoke-mpi]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment:
      name: pypi
      url: https://pypi.org/p/rabbit-fem
    permissions:
      contents: write
      id-token: write

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Verify tag is on main branch"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Tag ${{ github.ref_name }} is not on the main branch! Skipping release."
            exit 1
          }

      - name: "Download all built wheels"
        uses: actions/download-artifact@v4
        with:
          pattern: rabbit-fem-*-wheel
          merge-multiple: true
          path: dist/

      - name: "Verify all required platform wheels are present"
        run: |
          echo "=== Content of dist/ ==="
          ls -la dist/
          linux_count=$(ls dist/*manylinux*.whl 2>/dev/null | wc -l)
          win_count=$(ls dist/*win_amd64.whl 2>/dev/null | wc -l)
          mac_count=$(ls dist/*macosx*.whl 2>/dev/null | wc -l)
          # NOTE: wheel filenames normalize "-" to "_" (PEP 427), so the
          # rabbit-fem-mpi distribution lands as rabbit_fem_mpi-*.whl.
          # Glob the normalized stem, not the project name.
          mpi_count=$(ls dist/rabbit_fem_mpi-*.whl 2>/dev/null | wc -l)
          echo "Found $linux_count Linux wheel(s), $win_count Windows wheel(s), $mac_count macOS wheel(s) and $mpi_count MPI wheel(s)."
          if [ "$linux_count" -lt 1 ]; then
            echo "::error::Missing Linux manylinux wheel in dist/!"
            exit 1
          fi
          if [ "$win_count" -lt 1 ]; then
            echo "::error::Missing Windows win_amd64 wheel in dist/!"
            exit 1
          fi
          if [ "$mac_count" -lt 1 ]; then
            echo "::error::Missing macOS macosx wheel in dist/!"
            exit 1
          fi
          if [ "$mpi_count" -lt 1 ]; then
            echo "::error::Missing rabbit-fem-mpi wheel in dist/!"
            exit 1
          fi
          echo "All platform wheels verified successfully."

      - name: "Publish consolidated wheels to PyPI"
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

      - name: "Create GitHub Release with wheel assets"
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
