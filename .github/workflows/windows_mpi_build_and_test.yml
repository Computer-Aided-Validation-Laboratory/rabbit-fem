name: "MPI, Windows: Build Wheel and Test"

# Windows MPI variant of rabbit-fem (system MS-MPI, no MFEM).
# First-go shape: build job (own windows-mpi caches, RABBIT_MPI=1) +
# test suite + an mpiexec -n 2 HEX8 proof. Compat/floor/mamba/smoke
# legs are deliberately deferred until the MPI build itself is green.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  windows-mpi-build-and-test:
    name: "MPI, Windows: Build Wheel and Test"
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      RABBIT_MPI: "1"

    steps:
      - name: "Windows MPI: Configure git long paths"
        run: git config --global core.longpaths true

      - name: "Windows MPI: Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # NOTE: no mingw-w64-x86_64-msmpi here on purpose. A runner can
      # carry two MSYS2 trees (image install plus this action's temp
      # install) and this list feeds only the latter, while the ps1
      # builds with the detected $MsysRoot — so the ps1 installs the
      # package itself into the tree it actually uses (single owner).
      - name: "Windows MPI: Set up MSYS2"
        uses: msys2/setup-msys2@v2
        with:
          location: 'C:\msys64'
          msystem: MSYS
          path-type: inherit
          update: false
          install: >-
            make
            diffutils
            patch
            python
            m4
            git
            cmake

      - name: "Windows MPI: Install system MS-MPI"
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: msmpi

      - name: "Windows MPI: Set up uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: "Windows MPI: Set up Python"
        run: |
          uv python install 3.13
          uv venv .venv

      # --- Top-Level Fast Path: Wheel Cache ---
      # All keys carry a windows-mpi infix so this stack never shares
      # state with the serial Windows build.
      - name: "Windows MPI: Restore wheel cache"
        uses: actions/cache/restore@v4
        id: wheel-windows-mpi-cache
        with:
          path: |
            dist
            src/rabbit/bin
            src/rabbit/share
          key: rabbit-fem-wheel-Windows-mpi-${{ hashFiles('src/**', 'include/**', 'Makefile', 'pyproject.toml', 'moose_version.txt', 'moose_deps.txt', 'scripts/**', 'build_rabbit.py', 'patches/**') }}

      # --- Stage 1: PETSc Dependency ---
      # NOTE: dependency caches use exact keys with no restore-keys prefix
      # fallback. A key miss means the recipe changed, so any older tree
      # would be stale; the build scripts skip stages whose artifacts already
      # exist, which would silently keep the stale tree (and re-save it under
      # the new key - see the Sep-28 X11 entry in dev/log_opencode_fixes.md).
      # A miss therefore rebuilds from scratch, which is what a recipe change
      # requires.
      - name: "Windows MPI: Restore PETSc cache"
        if: steps.wheel-windows-mpi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: petsc-windows-mpi-cache
        with:
          path: moose/petsc/arch-windows-opt
          key: windows-mpi-petsc-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'patches/**') }}

      - name: "Windows MPI: Build PETSc"
        if: steps.wheel-windows-mpi-cache.outputs.cache-hit != 'true' && steps.petsc-windows-mpi-cache.outputs.cache-hit != 'true'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install_dependencies_windows.ps1 -Stage petsc

      - name: "Windows MPI: Save PETSc cache"
        if: steps.wheel-windows-mpi-cache.outputs.cache-hit != 'true' && steps.petsc-windows-mpi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: moose/petsc/arch-windows-opt
          key: windows-mpi-petsc-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'patches/**') }}

      # --- Stage 2: libMesh Dependency ---
      - name: "Windows MPI: Restore libMesh cache"
        if: steps.wheel-windows-mpi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: libmesh-windows-mpi-cache
        with:
          path: moose/libmesh/installed
          key: windows-mpi-libmesh-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'patches/**') }}

      - name: "Windows MPI: Build libMesh"
        if: steps.wheel-windows-mpi-cache.outputs.cache-hit != 'true' && steps.libmesh-windows-mpi-cache.outputs.cache-hit != 'true'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install_dependencies_windows.ps1 -Stage libmesh

      - name: "Windows MPI: Save libMesh cache"
        if: steps.wheel-windows-mpi-cache.outputs.cache-hit != 'true' && steps.libmesh-windows-mpi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: moose/libmesh/installed
          key: windows-mpi-libmesh-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'patches/**') }}

      # --- Stage 3: WASP and HIT Dependency ---
      - name: "Windows MPI: Restore WASP cache"
        if: steps.wheel-windows-mpi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: wasp-windows-mpi-cache
        with:
          path: |
            moose/framework/contrib/wasp/install
            moose/framework/contrib/wasp/build
            moose/framework/contrib/hit/hit.exe
          key: windows-mpi-wasp-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'patches/**') }}

      - name: "Windows MPI: Build WASP and HIT"
        if: steps.wheel-windows-mpi-cache.outputs.cache-hit != 'true' && steps.wasp-windows-mpi-cache.outputs.cache-hit != 'true'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install_dependencies_windows.ps1 -Stage wasp

      - name: "Windows MPI: Save WASP cache"
        if: steps.wheel-windows-mpi-cache.outputs.cache-hit != 'true' && steps.wasp-windows-mpi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            moose/framework/contrib/wasp/install
            moose/framework/contrib/wasp/build
            moose/framework/contrib/hit/hit.exe
          key: windows-mpi-wasp-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'patches/**') }}

      # --- Stage 4: MOOSE Framework Configuration ---
      - name: "Windows MPI: Restore MOOSE Config cache"
        if: steps.wheel-windows-mpi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: mooseconfig-windows-mpi-cache
        with:
          path: moose/framework/include/base/MooseConfig.h
          key: windows-mpi-mooseconfig-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'patches/**') }}

      - name: "Windows MPI: Configure MOOSE"
        if: steps.wheel-windows-mpi-cache.outputs.cache-hit != 'true' && steps.mooseconfig-windows-mpi-cache.outputs.cache-hit != 'true'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install_dependencies_windows.ps1 -Stage moose

      - name: "Windows MPI: Save MOOSE Config cache"
        if: steps.wheel-windows-mpi-cache.outputs.cache-hit != 'true' && steps.mooseconfig-windows-mpi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: moose/framework/include/base/MooseConfig.h
          key: windows-mpi-mooseconfig-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**', 'patches/**') }}

      # --- Stage 5: Build Rabbit Application and Wheel ---
      - name: "Windows MPI: Build Rabbit application"
        if: steps.wheel-windows-mpi-cache.outputs.cache-hit != 'true'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install_dependencies_windows.ps1 -Stage rabbit

      - name: "Windows MPI: Package standalone wheel"
        if: steps.wheel-windows-mpi-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --wheel-only

      - name: "Windows MPI: Run test suite"
        run: |
          uv run python build_rabbit.py --test

      # Multi-rank proof: the MPI binary must converge a real 2-rank run
      # (singleton suite above cannot prove parallel execution). Every
      # native call is success-asserted immediately, so the step's
      # trailing exit code is its own verdict.
      - name: "Windows MPI: mpiexec multi-rank proof"
        run: |
          $ProofPython = ".venv\Scripts\python.exe"
          $MpiInput = & $ProofPython -c "from rabbit.sims import cube_thermomech_input_path, EElemType; print(cube_thermomech_input_path(EElemType.HEX8))"
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve HEX8 input path" }
          Remove-Item Env:\MOOSE_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:\PETSC_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:\LIBMESH_DIR -ErrorAction SilentlyContinue
          $RabbitExe = Join-Path $env:GITHUB_WORKSPACE "src\rabbit\bin\rabbit.exe"
          if (-not (Test-Path $RabbitExe)) { throw "Staged MPI binary missing: $RabbitExe" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\rabbit-winmpi-proof" | Out-Null
          Push-Location "$env:RUNNER_TEMP\rabbit-winmpi-proof"
          try {
            mpiexec -n 2 $RabbitExe -i $MpiInput Executioner/end_time=1
            if ($LASTEXITCODE -ne 0) { throw "mpiexec -n 2 HEX8 solve failed" }
            Get-ChildItem *.e | ForEach-Object { Write-Host "Output: $($_.Name) ($($_.Length) bytes)" }
            if (-not (Get-ChildItem *.e)) { throw "No Exodus output produced" }
            Write-Host "Windows MPI multi-rank proof OK"
          } finally {
            Pop-Location
          }
          exit 0

      - name: "Windows MPI: Save wheel cache"
        if: steps.wheel-windows-mpi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist
            src/rabbit/bin
            src/rabbit/share
          key: rabbit-fem-wheel-Windows-mpi-${{ hashFiles('src/**', 'include/**', 'Makefile', 'pyproject.toml', 'moose_version.txt', 'moose_deps.txt', 'scripts/**', 'build_rabbit.py', 'patches/**') }}

      - name: "Windows MPI: Upload wheel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-fem-windows-mpi-wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: "Windows MPI: Upload build failure logs"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-mpi-build-failure-logs
          path: |
            current_step.log
            make.log
            last_step.log
            paste_url.txt
            moose/petsc/arch-windows-opt/lib/petsc/conf/configure.log
          if-no-files-found: ignore
