name: "Windows: Build Wheel and Test"

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  windows-build-and-test:
    name: "Windows: Build Wheel and Test"
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: "Windows: Configure git long paths"
        run: git config --global core.longpaths true

      - name: "Windows: Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "Windows: Set up MSYS2"
        uses: msys2/setup-msys2@v2
        with:
          msys2-location: 'C:\msys64'
          msystem: MSYS
          path-type: inherit
          update: false
          install: >-
            make
            diffutils
            patch
            python
            m4
            git

      - name: "Windows: Set up uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: "Windows: Set up Python"
        run: |
          uv python install 3.13
          uv venv .venv

      - name: "Windows: Restore MOOSE cache"
        uses: actions/cache/restore@v4
        id: moose-windows-cache
        with:
          path: |
            moose/petsc/arch-windows-opt
            moose/libmesh/installed
            moose/framework/contrib/wasp/install
            moose/framework/contrib/wasp/build
            moose/framework/contrib/hit/hit.exe
            moose/framework/include/base/MooseConfig.h
          key: windows-moose-build-${{ hashFiles('moose_version.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**') }}
          restore-keys: |
            windows-moose-build-

      - name: "Windows: Build MOOSE dependencies and Rabbit"
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install_dependencies_windows.ps1

      - name: "Windows: Save MOOSE cache"
        if: steps.moose-windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            moose/petsc/arch-windows-opt
            moose/libmesh/installed
            moose/framework/contrib/wasp/install
            moose/framework/contrib/wasp/build
            moose/framework/contrib/hit/hit.exe
            moose/framework/include/base/MooseConfig.h
          key: windows-moose-build-${{ hashFiles('moose_version.txt', 'scripts/install_dependencies_windows.ps1', 'scripts/windows_wrappers/**') }}

      - name: "Windows: Package standalone wheel and run tests"
        run: |
          uv run python build_rabbit.py --wheel-only --test

      - name: "Windows: Upload wheel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-fem-windows-wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: "Windows: Verify tag is on main branch"
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Tag ${{ github.ref_name }} is not on the main branch! Skipping PyPI upload."
            exit 1
          }

      - name: "Windows: Publish wheel to PyPI"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
