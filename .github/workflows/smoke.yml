name: "Reusable: Clean-machine wheel smoke test"

# CI-only reusable workflow. Called after a platform build job with the
# exact wheel artifact under test: no checkout (so no moose/ source tree
# exists and the binary's baked in-tree fallback paths cannot mask a
# broken wheel), no rebuild, clean uv venv, real cube solve.
on:
  workflow_call:
    inputs:
      platform:
        description: "Target platform: linux, macos, or windows"
        required: true
        type: string
      artifact:
        description: "Wheel artifact name uploaded by the build job"
        required: true
        type: string
      runner:
        description: "Runner label for the smoke job"
        required: true
        type: string

jobs:
  smoke:
    name: "Clean-machine smoke test (${{ inputs.platform }})"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    steps:
      - name: "Smoke: Set up uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: "Smoke: Set up Python"
        run: |
          uv python install 3.13

      - name: "Smoke: Download wheel artifact"
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: dist/

      - name: "Smoke (linux/macos): Install wheel in clean venv and solve"
        if: inputs.platform != 'windows'
        run: |
          uv venv /tmp/rabbit-smoke
          uv pip install --python /tmp/rabbit-smoke/bin/python dist/*.whl
          SMOKE_BIN=$(/tmp/rabbit-smoke/bin/python -c "from rabbit.cli import get_binary_path; print(get_binary_path())")
          echo "Smoke binary: $SMOKE_BIN"
          env -u MOOSE_DIR -u PETSC_DIR -u LIBMESH_DIR -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH /tmp/rabbit-smoke/bin/rabbit --version
          if [ "${{ inputs.platform }}" = "linux" ]; then
            if LD_LIBRARY_PATH= ldd "$SMOKE_BIN" | grep -q "not found"; then
              echo "::error::Wheel is missing shared libraries:"
              LD_LIBRARY_PATH= ldd "$SMOKE_BIN" | grep "not found"
              exit 1
            fi
          else
            if otool -L "$SMOKE_BIN" | grep -E "/Users/|/home/|/tmp/|/opt/moose" | grep -v "^$SMOKE_BIN"; then
              echo "::error::Wheel links hardcoded build-tree paths:"
              otool -L "$SMOKE_BIN"
              exit 1
            fi
          fi
          mkdir -p /tmp/rabbit-smoke-run && cd /tmp/rabbit-smoke-run
          env -u MOOSE_DIR -u PETSC_DIR -u LIBMESH_DIR -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH /tmp/rabbit-smoke/bin/python -c "from rabbit.sims import cube_thermomech_input_path, EElemType, run_rabbit; r = run_rabbit(cube_thermomech_input_path(EElemType.HEX8), extra_args=['Executioner/end_time=1']); assert r.returncode == 0; print('Smoke solve OK')"
          ls -la /tmp/rabbit-smoke-run/*.e

      - name: "Smoke (windows): Install wheel in clean venv and solve"
        if: inputs.platform == 'windows'
        run: |
          uv venv "$env:RUNNER_TEMP\rabbit-smoke"
          $SmokePython = "$env:RUNNER_TEMP\rabbit-smoke\Scripts\python.exe"
          $Wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          uv pip install --python $SmokePython $Wheel
          Remove-Item Env:\MOOSE_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:\PETSC_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:\LIBMESH_DIR -ErrorAction SilentlyContinue
          & "$env:RUNNER_TEMP\rabbit-smoke\Scripts\rabbit.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Smoke rabbit --version failed" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\rabbit-smoke-run" | Out-Null
          Push-Location "$env:RUNNER_TEMP\rabbit-smoke-run"
          try {
            & $SmokePython -c "from rabbit.sims import cube_thermomech_input_path, EElemType, run_rabbit; r = run_rabbit(cube_thermomech_input_path(EElemType.HEX8), extra_args=['Executioner/end_time=1']); assert r.returncode == 0; print('Smoke solve OK')"
            if ($LASTEXITCODE -ne 0) { throw "Smoke solve failed" }
            Get-ChildItem *.e | ForEach-Object { Write-Host "Output: $($_.Name) ($($_.Length) bytes)" }
            if (-not (Get-ChildItem *.e)) { throw "No Exodus output produced" }
          } finally {
            Pop-Location
          }
