name: "Reusable: Clean-machine wheel smoke test"

# CI-only reusable workflow. Called after a platform build job with the
# exact wheel artifact under test: no checkout (so no moose/ source tree
# exists and the binary's baked in-tree fallback paths cannot mask a
# broken wheel), no rebuild, clean uv venv, real cube solve.
on:
  workflow_call:
    inputs:
      platform:
        description: "Target platform: linux, macos, or windows"
        required: true
        type: string
      artifact:
        description: "Wheel artifact name uploaded by the build job"
        required: true
        type: string
      runner:
        description: "Runner label for the smoke job"
        required: true
        type: string
      mpi:
        description: "Exercise mpirun (MPI wheel) instead of the SMP thread check"
        required: false
        default: false
        type: boolean
      mpi_impl:
        description: "MPI implementation runtime for MPI smoke runs (openmpi or mpich)"
        required: false
        default: "openmpi"
        type: string
      python-version:
        description: "Python version for the clean smoke venv (compat matrix)"
        required: false
        default: "3.13"
        type: string
      run-gold:
        description: "Run HEX8+HEX20 gold regression (test/test_cube_gold.py) after the smoke solve"
        required: false
        default: false
        type: boolean

jobs:
  smoke:
    name: "Clean-machine smoke test (${{ inputs.platform }}, py ${{ inputs.python-version }})"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    steps:
      - name: "Smoke: Checkout regression tests (gold only)"
        if: inputs.run-gold
        uses: actions/checkout@v4
        with:
          # Sparse: only the pytest regression payload. moose/ is
          # gitignored (never a submodule), so no checkout can
          # materialize the in-tree data fallback paths the smoke job
          # exists to exclude -- the clean-machine invariant holds.
          fetch-depth: 1
          submodules: false
          sparse-checkout: |
            test
            pyproject.toml

      - name: "Smoke: Set up uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: "Smoke: Set up Python"
        run: |
          uv python install ${{ inputs.python-version }}

      - name: "Smoke: Download wheel artifact"
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: dist/

      - name: "Smoke (macos): Install MPI runtime libraries"
        if: inputs.platform == 'macos'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          # The wheel links Homebrew open-mpi/hdf5-mpi by design (left
          # external like Linux's system MPI), so the runtimes must be
          # present even for serial runs.
          brew install open-mpi hdf5-mpi

      - name: "Smoke (macos): Mach-O diagnostics"
        if: inputs.platform == 'macos'
        run: |
          # Colleague report: `zsh: killed rabbit` even for bare `rabbit`
          # (kernel SIGKILL, not a dyld abort). Facts first, all
          # informational (codesign -dv prints either way; the --version
          # and solve steps below remain the pass/fail gates):
          # arch (arm64 vs Intel mismatch), linkage, and signature state
          # after the install_name_tool relink + ad-hoc re-sign.
          SMOKE_WHEEL=$(ls dist/*.whl | head -n 1)
          echo "Wheel: $SMOKE_WHEEL"
          uv venv /tmp/rabbit-smoke-diag --python ${{ inputs.python-version }}
          uv pip install --python /tmp/rabbit-smoke-diag/bin/python "$SMOKE_WHEEL"
          SMOKE_BIN=$(/tmp/rabbit-smoke-diag/bin/python -c "from rabbit.cli import get_binary_path; print(get_binary_path())")
          echo "Smoke binary: $SMOKE_BIN"
          uname -m
          file "$SMOKE_BIN"
          if command -v lipo >/dev/null 2>&1; then
            lipo -info "$SMOKE_BIN"
          fi
          otool -L "$SMOKE_BIN"
          # Informational only: an unsigned/invalid signature must not
          # fail this step (the --version/solve steps below are the
          # gates); the branch below keeps the outcome explicit.
          if codesign -dv "$SMOKE_BIN" 2>&1; then
            echo "codesign: signature validates."
          else
            echo "NOTE: binary is unsigned or its signature does not validate (see above)."
          fi
          # Direct exec separates wrapper failures from binary failures
          # and names SIGKILL (137, the `zsh: killed` signature) loudly.
          set +e
          "$SMOKE_BIN" --version >/tmp/rabbit-diag-version.log 2>&1
          RC=$?
          set -e
          cat /tmp/rabbit-diag-version.log
          if [ $RC -eq 137 ]; then
            echo "::error::rabbit binary SIGKILLed (exit 137, 'zsh: killed'). Suspect: invalid code signature after relinking or arm64/Intel arch mismatch. See file/lipo/codesign output above."
            exit 1
          fi
          if [ $RC -ne 0 ]; then
            echo "::error::rabbit binary --version failed with exit $RC (see log above)."
            exit 1
          fi
          rm -rf /tmp/rabbit-smoke-diag

      - name: "Smoke (linux/macos): Install wheel in clean venv and solve"
        if: inputs.platform != 'windows'
        run: |
          if [ "${{ inputs.platform }}" = "linux" ]; then
            # The wheel links its MPI ecosystem externally by design, so
            # the matching runtime must be present. Only one MPI ships
            # per runner, so bare mpirun resolves deterministically.
            if [ "${{ inputs.mpi_impl }}" = "mpich" ]; then
              sudo apt-get update
              sudo apt-get install -y mpich
            else
              sudo apt-get update
              sudo apt-get install -y openmpi-bin
            fi
          fi
          uv venv /tmp/rabbit-smoke --python ${{ inputs.python-version }}
          uv pip install --python /tmp/rabbit-smoke/bin/python dist/*.whl
          if [ "${{ inputs.run-gold }}" = "true" ]; then
            uv pip install --python /tmp/rabbit-smoke/bin/python pytest numpy netCDF4
          fi
          SMOKE_BIN=$(/tmp/rabbit-smoke/bin/python -c "from rabbit.cli import get_binary_path; print(get_binary_path())")
          echo "Smoke binary: $SMOKE_BIN"
          if [ "${{ inputs.platform }}" = "linux" ]; then
            if LD_LIBRARY_PATH= ldd "$SMOKE_BIN" | grep -q "not found"; then
              echo "::error::Wheel is missing shared libraries:"
              LD_LIBRARY_PATH= ldd "$SMOKE_BIN" | grep "not found"
              exit 1
            fi
            env -u MOOSE_DIR -u PETSC_DIR -u LIBMESH_DIR -u LD_LIBRARY_PATH /tmp/rabbit-smoke/bin/rabbit --version
          else
            if otool -L "$SMOKE_BIN" | grep -E "/Users/|/home/|/tmp/|/opt/moose" | grep -v "^$SMOKE_BIN"; then
              echo "::error::Wheel links hardcoded build-tree paths:"
              otool -L "$SMOKE_BIN"
              exit 1
            fi
            env -u MOOSE_DIR -u PETSC_DIR -u LIBMESH_DIR -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH /tmp/rabbit-smoke/bin/rabbit --version
          fi
          mkdir -p /tmp/rabbit-smoke-run && cd /tmp/rabbit-smoke-run
          env -u MOOSE_DIR -u PETSC_DIR -u LIBMESH_DIR -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH /tmp/rabbit-smoke/bin/python -c "from rabbit.sims import cube_thermomech_input_path, EElemType, run_rabbit; r = run_rabbit(cube_thermomech_input_path(EElemType.HEX8), extra_args=['Executioner/end_time=1']); assert r.returncode == 0; print('Smoke solve OK')"
          ls -la /tmp/rabbit-smoke-run/*.e
          if [ "${{ inputs.mpi }}" = "true" ]; then
            # MPI wheel: prove a real multi-rank run converges.
            # OpenMPI refuses more ranks than slots without
            # --oversubscribe (small runners); MPICH oversubscribes by
            # default and has no such flag, so exempt it.
            MPIRUN_OVERCOMMIT=""
            if [ "${{ inputs.mpi_impl }}" != "mpich" ]; then
              MPIRUN_OVERCOMMIT="--oversubscribe"
            fi
            INPUT=$(/tmp/rabbit-smoke/bin/python -c "from rabbit.sims import cube_thermomech_input_path, EElemType; print(cube_thermomech_input_path(EElemType.HEX8))")
            mkdir -p /tmp/rabbit-smoke-mpi-run && cd /tmp/rabbit-smoke-mpi-run
            env -u MOOSE_DIR -u PETSC_DIR -u LIBMESH_DIR -u LD_LIBRARY_PATH mpirun $MPIRUN_OVERCOMMIT -n 2 "$SMOKE_BIN" -i "$INPUT" Executioner/end_time=1
            ls -la /tmp/rabbit-smoke-mpi-run/*.e
            echo "MPI smoke solve OK"
            # MPI wheel with the MFEM backend: prove the packaged Maxwell
            # case converges (singleton rank keeps partitioning
            # deterministic; serial legs never reach this branch).
            mkdir -p /tmp/rabbit-smoke-mfem-run && cd /tmp/rabbit-smoke-mfem-run
            env -u MOOSE_DIR -u PETSC_DIR -u LIBMESH_DIR -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH /tmp/rabbit-smoke/bin/python -c "from rabbit.sims import mfem_input_path, mfem_mesh_path, run_rabbit; r = run_rabbit(mfem_input_path('curlcurl'), extra_args=['Mesh/file=' + str(mfem_mesh_path('curlcurl'))]); assert r.returncode == 0; print('MFEM smoke solve OK')"
            ls -la /tmp/rabbit-smoke-mfem-run/OutputData/CurlCurl/*.csv
            # Same MFEM case multi-rank: `mpirun -n 4 rabbit <deck>.i`
            # proves the backend actually runs in parallel (the singleton
            # above only proves the packaged layout resolves).
            MFEM_MPI_INPUT=$(/tmp/rabbit-smoke/bin/python -c "from rabbit.sims import mfem_input_path; print(mfem_input_path('curlcurl'))")
            MFEM_MPI_MESH=$(/tmp/rabbit-smoke/bin/python -c "from rabbit.sims import mfem_mesh_path; print(mfem_mesh_path('curlcurl'))")
            mkdir -p /tmp/rabbit-smoke-mfem-mpi-run && cd /tmp/rabbit-smoke-mfem-mpi-run
            env -u MOOSE_DIR -u PETSC_DIR -u LIBMESH_DIR -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH mpirun $MPIRUN_OVERCOMMIT -n 4 "$SMOKE_BIN" -i "$MFEM_MPI_INPUT" Mesh/file="$MFEM_MPI_MESH"
            ls -la /tmp/rabbit-smoke-mfem-mpi-run/OutputData/CurlCurl/*.csv
            echo "MFEM MPI smoke solve OK"
          else
            # Serial wheel: prove SMP threading parallelises. This step
            # runs on Linux/macOS only (the whole step is skipped on
            # Windows, whose libMesh builds with --with-thread-model=none).
            mkdir -p /tmp/rabbit-smoke-smp-run && cd /tmp/rabbit-smoke-smp-run
            env -u MOOSE_DIR -u PETSC_DIR -u LIBMESH_DIR -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH /tmp/rabbit-smoke/bin/python -c "from rabbit.sims import cube_thermomech_input_path, EElemType, run_rabbit; r = run_rabbit(cube_thermomech_input_path(EElemType.HEX8), extra_args=['Executioner/end_time=1', '--n-threads=2']); assert r.returncode == 0; print('SMP smoke solve OK')"
            ls -la /tmp/rabbit-smoke-smp-run/*.e
          fi

      - name: "Smoke (linux/macos): Gold regression (HEX8 + HEX20)"
        if: inputs.platform != 'windows' && inputs.run-gold
        run: |
          # Compares fresh solves against committed snapshots in
          # test/gold/ (tolerances in test/test_cube_gold.py). HEX8 is
          # the default smoke case; HEX20 is the colleague's failing
          # case. The full six-element matrix runs in the build job's
          # test suite (Python 3.13); these two bound compat-leg time.
          cd "$GITHUB_WORKSPACE"
          /tmp/rabbit-smoke/bin/python -m pytest test/test_cube_gold.py -k "HEX8 or HEX20" -v

      - name: "Smoke (windows): Install wheel in clean venv and solve"
        if: inputs.platform == 'windows'
        run: |
          uv venv "$env:RUNNER_TEMP\rabbit-smoke" --python ${{ inputs.python-version }}
          $SmokePython = "$env:RUNNER_TEMP\rabbit-smoke\Scripts\python.exe"
          $Wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          uv pip install --python $SmokePython $Wheel
          if ("${{ inputs.run-gold }}" -eq "true") {
            uv pip install --python $SmokePython pytest numpy netCDF4
          }
          Remove-Item Env:\MOOSE_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:\PETSC_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:\LIBMESH_DIR -ErrorAction SilentlyContinue
          & "$env:RUNNER_TEMP\rabbit-smoke\Scripts\rabbit.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Smoke rabbit --version failed" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\rabbit-smoke-run" | Out-Null
          Push-Location "$env:RUNNER_TEMP\rabbit-smoke-run"
          try {
            & $SmokePython -c "from rabbit.sims import cube_thermomech_input_path, EElemType, run_rabbit; r = run_rabbit(cube_thermomech_input_path(EElemType.HEX8), extra_args=['Executioner/end_time=1']); assert r.returncode == 0; print('Smoke solve OK')"
            if ($LASTEXITCODE -ne 0) { throw "Smoke solve failed" }
            Get-ChildItem *.e | ForEach-Object { Write-Host "Output: $($_.Name) ($($_.Length) bytes)" }
            if (-not (Get-ChildItem *.e)) { throw "No Exodus output produced" }
          } finally {
            Pop-Location
          }

      - name: "Smoke (windows): Gold regression (HEX8 + HEX20)"
        if: inputs.platform == 'windows' && inputs.run-gold
        run: |
          # Same comparison as the linux/macos gold step, pwsh spelling:
          # fresh solves vs committed snapshots in test/gold/ (tolerances
          # in test/test_cube_gold.py). Sparse checkout from the gold-only
          # checkout step keeps the clean-machine invariant (moose/ is
          # gitignored, so no in-tree fallback paths exist).
          Set-Location $env:GITHUB_WORKSPACE
          & "$env:RUNNER_TEMP\rabbit-smoke\Scripts\python.exe" -m pytest test/test_cube_gold.py -k "HEX8 or HEX20" -v
          if ($LASTEXITCODE -ne 0) { throw "Gold regression failed" }
