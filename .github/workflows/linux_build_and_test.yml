name: "Linux: Build Wheel and Test"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  linux-build-and-test:
    name: "Linux: Build Wheel and Test"
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: "Linux: Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "Linux: Install system packages"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            libopenmpi-dev \
            openmpi-bin \
            patchelf \
            libtirpc-dev \
            libomp-dev \
            libglu1-mesa

      - name: "Linux: Set up uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: "Linux: Set up Python"
        run: |
          uv python install 3.13
          uv venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: "Linux: Install Python build tools"
        run: |
          uv pip install ziglang==0.16.0 wheel packaging pyyaml jinja2 pytest gmsh numpy netCDF4

      # --- Top-Level Fast Path: Wheel Cache ---
      - name: "Linux: Restore wheel cache"
        uses: actions/cache/restore@v4
        id: wheel-cache
        with:
          path: |
            dist
            src/rabbit/bin
            src/rabbit/lib
            src/rabbit/share
          key: rabbit-fem-wheel-Linux-serial-${{ hashFiles('src/**', 'include/**', 'Makefile', 'pyproject.toml', 'moose_version.txt', 'moose_deps.txt', 'scripts/build/**', 'build_rabbit.py') }}

      # --- Stage 1: PETSc Dependency ---
      # NOTE: dependency caches use exact keys with no restore-keys prefix
      # fallback. A key miss means the recipe changed, so any older tree
      # would be stale; the build scripts skip stages whose artifacts already
      # exist, which would silently keep the stale tree (and re-save it under
      # the new key - see the Sep-28 X11 entry in dev/log_opencode_fixes.md).
      # A miss therefore rebuilds from scratch, which is what a recipe change
      # requires.
      - name: "Linux: Restore PETSc cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: petsc-cache
        with:
          path: moose/petsc
          key: linux-serial-petsc-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      - name: "Linux: Build PETSc"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.petsc-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --build-petsc

      - name: "Linux: Save PETSc cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.petsc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: moose/petsc
          key: linux-serial-petsc-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      # --- Stage 2: libMesh Dependency ---
      - name: "Linux: Restore libMesh cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: libmesh-cache
        with:
          path: moose/libmesh/installed
          key: linux-serial-libmesh-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      - name: "Linux: Build libMesh"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.libmesh-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --build-libmesh

      - name: "Linux: Save libMesh cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.libmesh-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: moose/libmesh/installed
          key: linux-serial-libmesh-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      # --- Stage 3: WASP and HIT Dependency ---
      - name: "Linux: Restore WASP cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: wasp-cache
        with:
          path: |
            moose/framework/contrib/wasp/install
            moose/framework/contrib/hit
          key: linux-serial-wasp-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      - name: "Linux: Build WASP and HIT"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.wasp-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --build-wasp

      - name: "Linux: Save WASP cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.wasp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            moose/framework/contrib/wasp/install
            moose/framework/contrib/hit
          key: linux-serial-wasp-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      # --- Stage 4: MOOSE Framework Configuration ---
      - name: "Linux: Restore MOOSE Config cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: mooseconfig-cache
        with:
          path: moose/framework/include/base/MooseConfig.h
          key: linux-serial-mooseconfig-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      - name: "Linux: Configure MOOSE"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.mooseconfig-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --configure-moose

      - name: "Linux: Save MOOSE Config cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.mooseconfig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: moose/framework/include/base/MooseConfig.h
          key: linux-serial-mooseconfig-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      # --- Stage 5: Build Rabbit Application and Wheel ---
      - name: "Linux: Build Rabbit, stage artifacts, and build wheel"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --wheel

      - name: "Linux: Run test suite"
        run: |
          uv run python build_rabbit.py --test

      - name: "Linux: Save wheel cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist
            src/rabbit/bin
            src/rabbit/lib
            src/rabbit/share
          key: rabbit-fem-wheel-Linux-serial-${{ hashFiles('src/**', 'include/**', 'Makefile', 'pyproject.toml', 'moose_version.txt', 'moose_deps.txt', 'scripts/build/**', 'build_rabbit.py') }}

      - name: "Linux: Upload wheel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-fem-linux-wheel
          path: dist/*.whl
          if-no-files-found: error

  linux-smoke:
    name: "Linux: Clean-machine smoke test"
    needs: linux-build-and-test
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux
      artifact: rabbit-fem-linux-wheel
      runner: ubuntu-24.04

  # Python-version compat: the exact wheel built above is installed into
  # one clean venv per supported interpreter (3.10-3.14; the primary
  # 3.13 smoke above covers 3.13) and must solve HEX8 plus match the
  # HEX8/HEX20 gold snapshots. Catches syntax/support regressions such
  # as the 3.9 PEP 604 `X | Y` TypeError without rebuilding per version.
  linux-compat:
    name: "Linux: Wheel compat (py ${{ matrix.python }})"
    needs: linux-build-and-test
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.14"]
    uses: ./.github/workflows/smoke.yml
    with:
      platform: linux
      artifact: rabbit-fem-linux-wheel
      runner: ubuntu-24.04
      python-version: ${{ matrix.python }}
      run-gold: true

  # Negative leg for the 3.9 colleague report: importing the package on
  # 3.9 must fail with the clear 3.10-floor message, never a deep
  # `TypeError: unsupported operand type(s) for |`. Needs no build
  # artifact (the guard lives in src/), so no `needs:` and it runs in
  # parallel with the build.
  linux-floor:
    name: "Linux: Python 3.9 floor message"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Floor: Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: "Floor: Set up uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: "Floor: Assert clear error on Python 3.9"
        run: |
          uv python install 3.9
          UVPY=$(uv python find 3.9)
          set +e
          PYTHONPATH=src "$UVPY" -c "import rabbit" > floor.log 2>&1
          RC=$?
          set -e
          cat floor.log
          if [ $RC -eq 0 ]; then
            echo "::error::'import rabbit' succeeded on Python 3.9; expected the 3.10-floor error."
            exit 1
          fi
          grep -q "requires Python 3.10" floor.log || {
            echo "::error::Python 3.9 error message does not mention the 3.10 floor."
            exit 1
          }
          echo "Floor guard OK: Python 3.9 fails with the clear message."

  # Mamba smoke: the exact wheel built above, installed with pip into a
  # conda-managed env (python=3.13, the primary build version, so the
  # installer is the only variable) on a clean runner. Narrow by
  # design: solve-only (--version + HEX8 solve), no gold, no moose
  # rebuild, no moose-from-mamba build. Guards the conda install path
  # (activation env vars, site-packages layout) that uv legs cannot model.
  linux-mamba:
    name: "Linux: Mamba smoke (py 3.13)"
    needs: linux-build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: "Mamba: Set up micromamba"
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: rabbit-mamba-smoke
          create-args: python=3.13 pip

      - name: "Mamba: Download wheel artifact"
        uses: actions/download-artifact@v4
        with:
          name: rabbit-fem-linux-wheel
          path: dist/

      - name: "Mamba (linux): Install wheel and solve"
        run: |
          # Same system-MPI runtime the uv smoke requires (wheel links
          # system OpenMPI by design).
          sudo apt-get update
          sudo apt-get install -y openmpi-bin
          micromamba run -n rabbit-mamba-smoke pip install dist/*.whl
          env -u MOOSE_DIR -u PETSC_DIR -u LIBMESH_DIR -u LD_LIBRARY_PATH micromamba run -n rabbit-mamba-smoke rabbit --version
          mkdir -p /tmp/rabbit-mamba-run && cd /tmp/rabbit-mamba-run
          env -u MOOSE_DIR -u PETSC_DIR -u LIBMESH_DIR -u LD_LIBRARY_PATH micromamba run -n rabbit-mamba-smoke python -c "from rabbit.sims import cube_thermomech_input_path, EElemType, run_rabbit; r = run_rabbit(cube_thermomech_input_path(EElemType.HEX8), extra_args=['Executioner/end_time=1']); assert r.returncode == 0; print('Mamba smoke solve OK')"
          ls -la /tmp/rabbit-mamba-run/*.e
