name: "Linux: Build Wheel and Test"

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  linux-build-and-test:
    name: "Linux: Build Wheel and Test"
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: "Linux: Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "Linux: Install system packages"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            libopenmpi-dev \
            openmpi-bin \
            patchelf \
            libtirpc-dev \
            libomp-dev \
            libglu1-mesa

      - name: "Linux: Set up uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: "Linux: Set up Python"
        run: |
          uv python install 3.13
          uv venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: "Linux: Install Python build tools"
        run: |
          uv pip install ziglang==0.16.0 wheel packaging pyyaml jinja2 pytest gmsh

      - name: "Linux: Restore MOOSE cache"
        uses: actions/cache/restore@v4
        id: moose-cache
        with:
          path: |
            moose/petsc
            moose/libmesh/installed
            moose/framework/contrib/wasp/install
            moose/framework/include/base/MooseConfig.h
          key: linux-moose-build-${{ hashFiles('moose_version.txt', 'build_rabbit.py') }}
          restore-keys: |
            linux-moose-build-

      - name: "Linux: Build MOOSE dependencies"
        if: steps.moose-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --moose

      - name: "Linux: Save MOOSE cache"
        if: steps.moose-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            moose/petsc
            moose/libmesh/installed
            moose/framework/contrib/wasp/install
            moose/framework/include/base/MooseConfig.h
          key: linux-moose-build-${{ hashFiles('moose_version.txt', 'build_rabbit.py') }}

      - name: "Linux: Build Rabbit, stage artifacts, and build wheel"
        run: |
          uv run python build_rabbit.py --wheel

      - name: "Linux: Run test suite"
        run: |
          uv run python build_rabbit.py --test

      - name: "Linux: Upload wheel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-fem-linux-wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: "Linux: Verify tag is on main branch"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Tag ${{ github.ref_name }} is not on the main branch! Skipping PyPI upload."
            exit 1
          }

      - name: "Linux: Publish wheel to PyPI"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
