name: "Linux: Build Wheel and Test"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  linux-build-and-test:
    name: "Linux: Build Wheel and Test"
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: "Linux: Checkout repository"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: "Linux: Install system packages"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            libopenmpi-dev \
            openmpi-bin \
            patchelf \
            libtirpc-dev \
            libomp-dev \
            libglu1-mesa

      - name: "Linux: Set up uv"
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: "Linux: Set up Python"
        run: |
          uv python install 3.13
          uv venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: "Linux: Install Python build tools"
        run: |
          uv pip install ziglang==0.16.0 wheel packaging pyyaml jinja2 pytest gmsh

      # --- Top-Level Fast Path: Wheel Cache ---
      - name: "Linux: Restore wheel cache"
        uses: actions/cache/restore@v4
        id: wheel-cache
        with:
          path: |
            dist
            src/rabbit/bin
            src/rabbit/lib
          key: rabbit-fem-wheel-Linux-${{ hashFiles('src/**', 'include/**', 'Makefile', 'pyproject.toml', 'moose_version.txt', 'moose_deps.txt', 'scripts/build/**', 'build_rabbit.py') }}

      # --- Stage 1: PETSc Dependency ---
      - name: "Linux: Restore PETSc cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: petsc-cache
        with:
          path: moose/petsc
          key: linux-petsc-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}
          restore-keys: |
            linux-petsc-

      - name: "Linux: Build PETSc"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.petsc-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --build-petsc

      - name: "Linux: Save PETSc cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.petsc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: moose/petsc
          key: linux-petsc-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      # --- Stage 2: libMesh Dependency ---
      - name: "Linux: Restore libMesh cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: libmesh-cache
        with:
          path: moose/libmesh/installed
          key: linux-libmesh-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}
          restore-keys: |
            linux-libmesh-

      - name: "Linux: Build libMesh"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.libmesh-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --build-libmesh

      - name: "Linux: Save libMesh cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.libmesh-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: moose/libmesh/installed
          key: linux-libmesh-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      # --- Stage 3: WASP and HIT Dependency ---
      - name: "Linux: Restore WASP cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: wasp-cache
        with:
          path: |
            moose/framework/contrib/wasp/install
            moose/framework/contrib/hit
          key: linux-wasp-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}
          restore-keys: |
            linux-wasp-

      - name: "Linux: Build WASP and HIT"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.wasp-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --build-wasp

      - name: "Linux: Save WASP cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.wasp-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            moose/framework/contrib/wasp/install
            moose/framework/contrib/hit
          key: linux-wasp-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      # --- Stage 4: MOOSE Framework Configuration ---
      - name: "Linux: Restore MOOSE Config cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        id: mooseconfig-cache
        with:
          path: moose/framework/include/base/MooseConfig.h
          key: linux-mooseconfig-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}
          restore-keys: |
            linux-mooseconfig-

      - name: "Linux: Configure MOOSE"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.mooseconfig-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --configure-moose

      - name: "Linux: Save MOOSE Config cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true' && steps.mooseconfig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: moose/framework/include/base/MooseConfig.h
          key: linux-mooseconfig-${{ hashFiles('moose_version.txt', 'moose_deps.txt', 'scripts/build/linux.py', 'scripts/build/common.py') }}

      # --- Stage 5: Build Rabbit Application and Wheel ---
      - name: "Linux: Build Rabbit, stage artifacts, and build wheel"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        run: |
          uv run python build_rabbit.py --wheel

      - name: "Linux: Run test suite"
        run: |
          uv run python build_rabbit.py --test

      - name: "Linux: Save wheel cache"
        if: steps.wheel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist
            src/rabbit/bin
            src/rabbit/lib
          key: rabbit-fem-wheel-Linux-${{ hashFiles('src/**', 'include/**', 'Makefile', 'pyproject.toml', 'moose_version.txt', 'moose_deps.txt', 'scripts/build/**', 'build_rabbit.py') }}

      - name: "Linux: Upload wheel artifact"
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-fem-linux-wheel
          path: dist/*.whl
          if-no-files-found: error
